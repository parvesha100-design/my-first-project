<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Project</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #222;
      margin: 0;
      padding: 40px 16px;
      text-align: center;
    }
    .card {
      background: #fff;
      max-width: 520px;
      margin: 0 auto;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    h1 { color: #2563eb; }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, I'm Parvesha!</h1>
    <p>This is my first project on GitHub. I'm learning to code.</p>
    <button onclick="sayHello()">Click me</button>
    <p id="message"></p>
  </div>

  <script>
    // This runs when the button is clicked
    function sayHello() {
      document.getElementById("message").textContent =
        "Welcome to my first web page!";
    }
  </script>
</body>
</html>
